<main>
    <h2>Prenumeruokite naujus receptus</h2>
    <form class="contact-form">
        <label for="vardas">Vardas:</label>
        <input type="text" id="vardas" name="vardas" required>

        <label for="email">El. paštas:</label>
        <input type="email" id="email" name="email" required>

        <label for="category">Kokie receptai domina?</label>
        <select id="category">
            <option value="mesos">Mėsos patiekalai</option>
            <option value="vegan">Veganiški</option>
            <option value="desertai">Desertai</option>
        </select>

        <input type="submit" value="Prenumeruoti">
        <input type="reset" value="Išvalyti">
    </form>
</main>
